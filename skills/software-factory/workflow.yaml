# workflow.yaml
# software-factory Meta Skill 工作流定义 (v0.3.0)
# Schema: v1.2
# 约定: 所有产物落在单一工作空间目录, 文件名 NN_<项目名>_<文档名>.<ext>
# 详细设计文档按 3 级优先级 + fallback 读 .docx 模板

version: v0.3.0
workflow: software-factory
description: |
  从需求到可运行软件的流水线。
  所有产物集中在 `<项目名>工作空间/` 一个目录, 数字前缀表示阶段序号。
  详细设计文档按优先级读"详细设计模板.docx"作为样式基线。

# -------------------------------------------------------------------
# 工作空间根 - 旧版 (requirements/ design/ development/ testing/)
# 已废弃, 全部走 workspace_dir 单目录模式
# -------------------------------------------------------------------
workspace:
  root_pattern: "<项目名>工作空间/"     # 缺省按"<项目名>工作空间/"建
  file_naming: "NN_<项目名>_<文档名>.<ext>"
  nn_padding: 2                         # 01 / 02 / ...
  # 注意: 这是 **生成产物目录**, 不放模板资源!

detail_template:
  # 模板查找优先级 (从上往下, 命中即用, 都未命中走 fallback)
  lookup_priority:
    - id: explicit_arg
      location: "$user_arg.template"
      description: "用户通过 --template=<绝对路径> 显式指定"
    - id: project_override
      location: "<workspace_dir>/详细设计模板.docx"
      description: "项目级覆盖 (用户为这个项目专门放了一份)"
    - id: skill_bundled
      location: "skills/software-factory/templates/详细设计模板.docx"
      description: "skill 自带, 随 skill 安装到 $CODEX_HOME/skills/ 一起分发"
    - id: fallback
      location: "(docx skill default)"
      description: "调用 docx skill 用其默认模板生成"
  # 模板本身是用户私有资产, 不入 git, 不复制进项目工作空间
  gitignore: "skills/**/templates/详细设计模板.docx"
  missing_action: ask_user   # ask_user | use_fallback
  message_when_missing: |
    未在以下位置找到 `详细设计模板.docx`:
      1. $user_arg.template (--template 参数)
      2. <workspace_dir>/详细设计模板.docx
      3. skills/software-factory/templates/详细设计模板.docx
    请提供绝对路径, 或留空用 docx skill 默认模板.

phases:

  - id: phase0
    name: 技能环境准备
    required: true
    parallel: false
    stages:
      - id: phase0.scan
        name: 扫描依赖
        input: [user_input]
        output: [phase0-missing-skills.md]
        on_failure: stop
      - id: phase0.install
        name: 安装缺失 Skill
        input: [phase0-missing-skills.md]
        output: [phase0-install-log.md]
        gating: "when phase0-missing-skills.md != empty"
        on_failure: ask_user
      - id: phase0.verify
        name: 校验 Skills 可用
        input: [$CODEX_HOME/skills]
        output: [phase0-report.md]
        on_failure: "retry(2) then ask_user"

  - id: phase1
    name: 需求评估
    required: true
    parallel: false
    stages:
      - id: phase1.detect_mode
        name: 识别 Idea / Spec 模式
        input: [user_input.text]
        output: [01_<项目名>_需求假设清单.md]   # 补全用, 标 [待确认]
        on_failure: default_to_idea
      - id: phase1.spec
        name: 需求规格说明书
        input: [user_input.text, 01_<项目名>_需求假设清单.md]
        output: [01_<项目名>_需求规格说明书.md]
        on_failure: "retry(1) then ask_user"

  - id: phase2
    name: 软件工厂流水线
    required: true
    parallel: false
    stages:
      - id: stage1.requirement_spec
        name: 需求规格 (产物)
        input: [01_<项目名>_需求规格说明书.md]
        output: [01_<项目名>_需求规格说明书.md]
        on_failure: non_blocking_warning

      - id: stage2.detail_design
        name: 详细设计 (按 detail_template.lookup_priority 找模板)
        input:
          - 01_<项目名>_需求规格说明书.md
          - detail_template.lookup_priority     # 命中位置决定样式基线
        output: [02_<项目名>_详细设计文档.docx]
        uses_skill: docx
        on_missing_template: detail_template.missing_action
        on_failure: "retry(1) then ask_user"

      - id: stage3.architecture
        name: 架构设计
        input: [01_<项目名>_需求规格说明书.md, 02_<项目名>_详细设计文档.docx]
        output: [03_<项目名>_架构设计.md]
        on_failure: "retry(1) then ask_user"

      - id: stage4.db_design
        name: 数据库设计 (有数据库时)
        input: [02_<项目名>_详细设计文档.docx]
        output: [04_<项目名>_数据库设计.md, 04_<项目名>_建库脚本.sql]
        gating: "has_database == true"
        on_failure: non_blocking_warning

      - id: stage5.ui_design
        name: UI 设计 (含前端必选)
        input: [02_<项目名>_详细设计文档.docx]
        output:
          - 04b_<项目名>_UI设计.md
          - 源代码/<项目名>-web/prototype.html
        gating: "has_frontend == true"
        skip_when: 'project_type in ["cli","backend-only"]'
        on_failure: non_blocking_warning

      - id: stage6.implementation
        name: 实现
        input: [02_<项目名>_详细设计文档.docx, 03_<项目名>_架构设计.md]
        output:
          - 源代码/<项目名>-server/
          - 源代码/<项目名>-web/
        on_failure: "retry(1) then ask_user"

      - id: stage7.build_and_run
        name: 构建运行
        input: [源代码/<项目名>-server/, 源代码/<项目名>-web/]
        output:
          - 源代码/<项目名>-server/runtime.log
          - 源代码/<项目名>-server/health-check.json
        on_failure: "retry(2) then ask_user"

      - id: stage8.browser_validation
        name: 浏览器验收 (前端必选)
        input: [源代码/<项目名>-server/health-check.json, 04b_<项目名>_UI设计.md]
        output:
          - 06_<项目名>_验收报告.md
          - screenshots/<NN>-<含义>.png
        gating: "has_frontend == true"
        on_failure: non_blocking_warning

      - id: stage9.test_and_review
        name: 测试 + 评审
        input: [源代码/<项目名>-server/, 源代码/<项目名>-web/]
        output:
          - 05_<项目名>_测试报告.md
          - 08_<项目名>_代码评审报告.md
        on_failure: non_blocking_warning

termination:
  success_when: "all_required_stages.status == completed"
  blocked_when: |
    连续 3 次同类失败且用户选择不接管。

controls:
  pause:
    command: "$software-factory pause"
    state_file: workspace/.workflow-state.json
  resume:
    command: "$software-factory --resume"
    reads: workspace/.workflow-state.json
  rerun_stage:
    command: "$software-factory --rerun=<stageId>"
    effect: |
      从指定 Stage 重跑; 上游 Artifact 必须仍存在, 否则需先 rebuild。
  dry_run:
    command: "$software-factory --dry-run"
    effect: "只执行到 Phase 1, 不进入 Phase 2"
  template_override:
    command: "$software-factory --template=<绝对路径>"
    effect: "覆盖 detail_template.lookup_priority[0], 强制使用指定模板"

changelog:
  - v0.3.0:
      - 修复: 模板查找路径从 "<项目名>工作空间/" 扩展到 4 级优先级
      - 模板改放 skills/software-factory/templates/, 加 .gitignore
      - 新增 --template=<绝对路径> 参数
  - v0.2.0: NN_<项目名>_<文档名> 命名 + 单工作空间 + 中文文件名
  - v0.1.0: 初始 scaffold