# workflow.yaml
# software-factory Meta Skill 工作流定义 (v0.5.1)
# Schema: v1.3
# 约定: 所有产物落在单一工作空间目录, 文件名 NN_<项目名>_<文档名>.<ext>
# 详细设计文档按 4 级优先级 + fallback 读 .docx 模板
# 架构设计阶段 (Stage 3) 必须调 scripts/render_arch.py 生成架构图 PNG (按业务模块)
# 详细设计 .docx 生成后必须调 scripts/fix_docx_headings.py 后处理 (禁自动编号 + 清残留)
# v0.5.1 强化: 业务模块维度强制 (SpringBoot 技术分层视为反例)

version: v0.5.1
workflow: software-factory
description: |
  从需求到可运行软件的流水线。 所有产物集中在 `<项目名>工作空间/` 一个目录, 数字前缀表示阶段序号。
  详细设计文档按优先级读 `详细设计模板.docx` 作为样式基线, 生成后必须调 `scripts/fix_docx_headings.py` 后处理。
  架构图自动生成 (scripts/render_arch.py) 是 Stage 3 的内置步骤, 强制按业务模块绘制.
# -------------------------------------------------------------------
# 工作空间根 - 旧版 (requirements/ design/ development/ testing/)
# 已废弃: 全部按 workspace_dir 单目录模式
# -------------------------------------------------------------------
workspace:
  root_pattern: "<项目名>工作空间/"     # 缺省按 "<项目名>工作空间/" 建
  file_naming: "NN_<项目名>_<文档名>.<ext>"
  nn_padding: 2                         # 01 / 02 / ...

detail_template:
  lookup_priority:
    - id: explicit_arg
      location: "$user_arg.template"
      description: "用户通过 --template=<绝对路径> 显式指定"
    - id: project_override
      location: "<workspace_dir>/详细设计模板.docx"
      description: "项目级覆盖 (用户为这个项目专门放了)"
    - id: skill_bundled
      location: "skills/software-factory/templates/详细设计模板.docx"
      description: "skill 自带, 随 skill 安装到 $CODEX_HOME/skills/ 一同分发"
    - id: fallback
      location: "(docx skill default)"
      description: "调 docx skill 用其默认模板生成"
  gitignore: "skills/**/templates/详细设计模板.docx"
  missing_action: ask_user   # ask_user | use_fallback
  message_when_missing: |
    未在以下位置找到 `详细设计模板.docx`:
      1. $user_arg.template (--template 参数)
      2. <workspace_dir>/详细设计模板.docx
      3. skills/software-factory/templates/详细设计模板.docx
    请提供绝对路径, 或留空用 docx skill 默认模板.

# v0.5.1: 标题双重编号后处理 (强制)
heading_fix:
  enabled: true
  required: true                                  # 不可跳过, docx skill 完成后必须执行
  script: "scripts/fix_docx_headings.py"
  input: "02_<项目名>_详细设计文档.docx"           # Stage 2 产出
  in_place: true
  exit_code_pass: 0
  forbidden_alternatives:                         # 不允许的替代方案
    - "doc.add_paragraph(text, style='Heading 1') 后手工调 disable_auto_number(p)"
    - "修改模板 numbering.xml (会污染模板)"
    - "在 9 节骨架文本里手写 一./1.1 编号"

# v0.5.0: 架构图自动生成
architecture_diagram:
  enabled: true
  required: true
  script: "scripts/render_arch.py"
  output: "03_<项目名>_架构图.png"
  embedding_target: "02_<项目名>_详细设计文档.docx"
  input_source: "03_<项目名>_架构设计.md"          # Stage 3 产出作为输入
  when: "always"                                  # always | optional
  fallback_on_missing_tooling: "ascii"            # matplotlib 不在时回退 ASCII
  # v0.5.1: 业务模块维度强制
  layer_naming_policy:
    enforce: "business_modules"
    forbidden_examples:                           # 这些命名禁止作为主层
      - "接入层"
      - "应用层"
      - "服务层"
      - "数据层"
      - "基础设施层"
      - "持久层"
      - "表现层"
      - "Controller"
      - "Service"
      - "Repository"
    required_columns_in_arch_md:                  # 03_<项目>_架构设计.md 必须含
      - "业务模块"
      - "问题描述"
      - "职责"
      - "入口"
      - "依赖"
  font_fallback:
    - "SimHei"
    - "Microsoft YaHei"
    - "PingFang SC"
    - "DejaVu Sans"

phases:

  - id: phase0
    name: 技能环境准备
    required: true
    parallel: false
    stages:
      - id: phase0.scan
        name: 扫描依赖
        input: [user_input]
        output: [phase0-missing-skills.md]
        on_failure: stop
      - id: phase0.install
        name: 安装缺失 Skill
        input: [phase0-missing-skills.md]
        output: [phase0-install-log.md]
        gating: "when phase0-missing-skills.md != empty"
        on_failure: ask_user
      - id: phase0.verify
        name: 校验 Skills 可用
        input: [$CODEX_HOME/skills]
        output: [phase0-report.md]
        on_failure: "retry(2) then ask_user"
      - id: phase0.template
        name: 检查详细设计模板就位
        input: [$CODEX_HOME/skills/software-factory/templates/]
        output: [phase0-template-setup.log]
        gating: "always"
        on_missing: detail_template.missing_action
      - id: phase0.tools
        name: 校验内置脚本工具 (v0.5.1 新增)
        commands:
          - "python scripts/render_arch.py --check"
          - "python scripts/fix_docx_headings.py --help"
        on_failure: warn_continue                  # 工具缺失可继续但记录警告

  - id: phase1
    name: 需求评估
    required: true
    parallel: false
    stages:
      - id: phase1.detect_mode
        name: 识别 Idea / Spec 模式
        input: [user_input.text]
        output: [01_<项目名>_需求假设清单.md]
        on_failure: default_to_idea
      - id: phase1.spec
        name: 需求规格说明书
        input: [user_input.text, 01_<项目名>_需求假设清单.md]
        output: [01_<项目名>_需求规格说明书.md]
        required_sections:                          # v0.5.1: 业务模块清单是 Phase 1 强制输出
          - "业务模块清单"
          - "用户角色"
          - "功能范围"
          - "非功能需求"
        on_failure: "retry(1) then ask_user"

  - id: phase2
    name: 软件工厂流水线
    required: true
    parallel: false
    stages:
      - id: stage1.requirement_spec
        name: 需求规格 (产物)
        input: [01_<项目名>_需求规格说明书.md]
        output: [01_<项目名>_需求规格说明书.md]
        # v0.5.1: 检验"业务模块清单"字段是否非空
        validation:
          - "assert 业务模块清单 in spec.md"
          - "assert len(业务模块清单) >= 2"
        on_failure: non_blocking_warning

      - id: stage2.detail_design
        name: 详细设计 (按 detail_template.lookup_priority 找模板)
        input:
          - 01_<项目名>_需求规格说明书.md
          - 03_<项目名>_架构设计.md
          - 03_<项目名>_架构图.png
          - detail_template.lookup_priority
        output: [02_<项目名>_详细设计文档.docx]
        uses_skill: docx
        on_missing_template: detail_template.missing_action
        on_failure: "retry(1) then ask_user"
        steps:
          - "按 detail_template.lookup_priority 找模板 (4 级 + fallback)"
          - "调 docx skill 用模板样式基线生成 02_<项目名>_详细设计文档.docx"
          - "嵌入 03_<项目名>_架构图.png 到 \"2. 总体设计\" 段"
          - "走 heading_fix 步骤调 scripts/fix_docx_headings.py 后处理"
        post_steps:
          - id: heading_fix
            name: 调 scripts/fix_docx_headings.py 修复 Heading 双重编号 (v0.5.1 强制)
            command: "python skills/software-factory/scripts/fix_docx_headings.py <workspace_dir>/02_<项目名>_详细设计文档.docx"
            expected: "exit_code == 0, 标题统计数 >= 9"
            on_failure: "stop_workflow"             # 不允许交付未修复的 .docx

      - id: stage3.architecture
        name: 架构设计 (含架构图自动生成, v0.5.1 强制业务模块)
        input: [01_<项目名>_需求规格说明书.md]
        output:
          - 03_<项目名>_架构设计.md
          - 03_<项目名>_架构图.png
        steps:
          - "从需求规格抽取业务模块列表 (Phase 1 里的 \"业务模块清单\")"
          - "写 03_<项目名>_架构设计.md (业务模块表格 + 技术栈 + API + 部署)"
          - "调 python scripts/render_arch.py --src 03_<项目名>_架构设计.md --out 03_<项目名>_架构图.png --title '<项目名> 系统架构图'"
          - "verify: PNG 文件存在, size > 50KB"
        validation:
          - "assert 业务模块 in 03_<项目>_架构设计.md"               # v0.5.1 强制
          - "assert 问题描述 column exists"                          # v0.5.1 强制
          - "assert not (接入层 + 应用层 + 服务层 + 数据层 + 基础设施层) in arch_diagram_layers"  # v0.5.1 反例校验
        on_failure: "retry(1) then ask_user"

      - id: stage4.db_design
        name: 数据库设计 (有数据库时)
        input: [02_<项目名>_详细设计文档.docx]
        output: [04_<项目名>_数据库设计.md, 04_<项目名>_建库脚本.sql]
        gating: "has_database == true"
        on_failure: non_blocking_warning

      - id: stage5.ui_design
        name: UI 设计 (前端型必需)
        input: [02_<项目名>_详细设计文档.docx]
        output:
          - 04b_<项目名>_UI设计.md
          - 源代码/<项目名>-web/prototype.html
        gating: "has_frontend == true"
        skip_when: 'project_type in ["cli","backend-only"]'
        on_failure: non_blocking_warning

      - id: stage6.implementation
        name: 实现
        input: [02_<项目名>_详细设计文档.docx, 03_<项目名>_架构设计.md]
        output:
          - 源代码/<项目名>-server/
          - 源代码/<项目名>-web/
        on_failure: "retry(1) then ask_user"

      - id: stage7.build_and_run
        name: 构建运行
        input: [源代码/<项目名>-server/, 源代码/<项目名>-web/]
        output:
          - 源代码/<项目名>-server/runtime.log
          - 源代码/<项目名>-server/health-check.json
        on_failure: "retry(2) then ask_user"

      - id: stage8.browser_validation
        name: 浏览器验收 (前端必需)
        input: [源代码/<项目名>-server/health-check.json, 04b_<项目名>_UI设计.md]
        output:
          - 06_<项目名>_验收报告.md
          - screenshots/<NN>-<语义>.png
        gating: "has_frontend == true"
        on_failure: non_blocking_warning

      - id: stage9.test_and_review
        name: 测试 + 评审
        input: [源代码/<项目名>-server/, 源代码/<项目名>-web/]
        output:
          - 05_<项目名>_测试报告.md
          - 08_<项目名>_代码评审报告.md
        on_failure: non_blocking_warning

termination:
  success_when: "all_required_stages.status == completed"
  blocked_when: |
    连续 3 次同类失败且用户选择不接管.

controls:
  pause:
    command: "$software-factory pause"
    state_file: workspace/.workflow-state.json
  resume:
    command: "$software-factory --resume"
    reads: workspace/.workflow-state.json
  rerun_stage:
    command: "$software-factory --rerun=<stageId>"
    effect: |
      从指定 Stage 重跑; 上游 Artifact 必须仍存在, 否则需重 build.
  dry_run:
    command: "$software-factory --dry-run"
    effect: "只执行到 Phase 1, 不进入 Phase 2"
  template_override:
    command: "$software-factory --template=<绝对路径>"
    effect: "覆盖 detail_template.lookup_priority[0], 强制使用指定模板"

