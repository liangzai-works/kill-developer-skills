# skill-manifest.yaml
# software-factory Meta Skill 的运行时依赖清单 (v0.2.0)
# Phase 0 启动时据此与 $CODEX_HOME/skills 已装清单做差集。

manifest_version: v0.2.0
owner: kill-developer-skills
compatible_skill_version: ">=0.2.0,<0.3.0"

# 通用全局 Skills —— 任何 workflow 都至少要有这些
required-skills:
  - id: documentation
    purpose: 文档结构化
    source: bundled
    install: official
  - id: docx
    purpose: 生成 .docx (02_详细设计文档 强制走此 skill)
    source: bundled
    install: official

# 按 workflow 分类的依赖
workflows:

  - id: software-factory
    description: 主工作流 (Idea / Spec → 9 Stage 流水线)
    required-skills:
      - id: requirement-analysis
        purpose: 需求拆解 / Idea 模式补全
        install_hint: "$skill-installer requirement-analysis"
      - id: pm-review-board
        purpose: 多角色 PRD 自检评审（产品 / 研发 / 测试 / 设计 / 运营 / 法务 6 视角）
        install_hint: "$skill-installer --repo hexi664/pm-review-board --path . --name pm-review-board"
        invokes_at: phase1.review
        notes: 仓库 hexi664/pm-review-board 内置 skill 名为 SPACE-review-board, 这里用仓库别名 pm-review-board 作为引用 ID; 实际触发名仍为 SPACE-review-board (来自 SKILL.md frontmatter)
      - id: documentation
        purpose: PRD / Design / Report 模板填充
      - id: product-design
        purpose: 页面规划、用户旅程
        optional_when: [cli, backend-only]
      - id: ui-design
        purpose: 设计系统、组件库、原型
        optional_when: [cli, backend-only]
      - id: frontend-design
        purpose: 前端视觉设计哲学（调色 / 排版 / 节奏），注入到 Stage 5 UI 设计与 Stage 6 web 源生成
        source: bundled
        invokes_at: [stage5.ui_design, stage6.implementation#web]
      - id: architecture-design
        purpose: 系统架构、API、数据库 Schema
      - id: coding
        purpose: 实现业务代码
      - id: build
        purpose: 编译 / 打包
      - id: deploy
        purpose: 启动服务、健康检查
      - id: browser-automation
        purpose: 浏览器自动化
        install_hint: "$browser control-in-app-browser"
      - id: playwright
        purpose: UI 验证、截图
        install_hint: "playwright install"
      - id: testing
        purpose: 单元 / 集成 / E2E
      - id: code-review
        purpose: 代码评审报告

# 扩展工作流 (按需启用, 不会强制安装)
optional-workflows:
  - id: java-workflow
    required-skills: [coding-java-spring, jpa-spec, sql-design]
  - id: python-workflow
    required-skills: [coding-python-fastapi, sql-design]
  - id: frontend-workflow
    required-skills: [coding-frontend-vue, ui-design, frontend-design]
  - id: aiops-workflow
    required-skills: [anomaly-detection, metric-analysis, log-investigation]

# 安装策略
install_policy:
  default_mode: interactive        # interactive | auto
  registry: "$CODEX_HOME/skills"
  allow_third_party: true
  verify_after_install: true

# 健康检查
healthcheck:
  each_skill:
    - must_have: SKILL.md
    - must_readable: true
    - has_metadata: true           # name / description / version 三件套
  overall:
    - all_required: present